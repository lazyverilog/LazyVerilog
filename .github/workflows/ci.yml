name: CI

# An allow-list: the matrix runs only when a change touches an input of the C++ build
# or its tests.  A deny-list of "things that are not code" was too loose -- every new
# kind of file (a script, an editor plugin, a doc) ran seven platforms until someone
# remembered to add it.  Push runs only on main; a branch is covered by its pull request,
# so a pushed PR branch no longer builds twice.  This is safe only while no CI check is
# a *required* check: a path-skipped workflow leaves a required check pending forever.
# If one becomes required, gate the jobs with an `if:` on a changes job instead.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/*.cpp"
      - "tools/*.hpp"
      - "CMakeLists.txt"
      - "cmake/**"
      - "assets/ascii_logo.txt"
      - "lazyverilog.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/*.cpp"
      - "tools/*.hpp"
      - "CMakeLists.txt"
      - "cmake/**"
      - "assets/ascii_logo.txt"
      - "lazyverilog.toml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: ubuntu-22.04
            platform: linux-x64-static
            container: quay.io/pypa/manylinux_2_28_x86_64
            cmake_extra: -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          - os: ubuntu-22.04-arm
            platform: linux-arm64-static
            container: quay.io/pypa/manylinux_2_28_aarch64
            cmake_extra: -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          - os: macos-15
            platform: darwin-x64
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - os: macos-15
            platform: darwin-arm64
            cmake_extra: ""
          - os: windows-2022
            platform: windows-x64
            # See release.yml for why Ninja+MSVC is used instead of the Visual
            # Studio generator here.
            cmake_extra: -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

    runs-on: ${{ matrix.os }}
    # The -static builds embed libstdc++ but still link glibc, so their glibc floor
    # is the build host's.  manylinux_2_28 (AlmaLinux 8) keeps it at 2.28 for RHEL 8.
    container: ${{ matrix.container }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up MSVC developer environment
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 2

      - name: Check glibc floor
        if: ${{ matrix.container }}
        shell: bash
        run: |
          # RHEL 8 ships glibc 2.28 and its own old libstdc++: fail if a binary needs more.
          for f in build/lazyverilog-lsp build/lazyverilog-fmt build/lazyverilog-lint build/lazyverilog-rtltree; do
            max=$(objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
            echo "$f: $max"
            printf '%s\n' "$max" GLIBC_2.28 | sort -VC
            if objdump -T "$f" | grep -q GLIBCXX_; then echo "$f needs a shared libstdc++"; exit 1; fi
          done

      - name: Test
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure

      # ctest shows a passing test's output only with -V, so the ratio guards'
      # margins were invisible until one failed.  Rerun them alone to log it.
      - name: Scaling guard ratios
        shell: bash
        run: |
          bin=$(find build -name 'lazyverilog-tests' -type f -o -name 'lazyverilog-tests.exe' -type f | head -1)
          "$bin" "[scaling]" 2>&1 | grep -E "^\[|ratio|small:|large:|scaling\]" || true
