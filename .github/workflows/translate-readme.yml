name: Translate README

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/translate-readme/**
  workflow_dispatch:
    inputs:
      languages:
        description: "Language codes, or --tier N, or --all (see scripts/translate-readme --help)"
        required: false
        default: "--tier 1"
        type: string
      force:
        description: "Re-translate even when the cached source hash matches"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Serialized: each run commits docs/i18n, so a second run must see the first
# run's cache rather than race it.  GitHub keeps only the newest run that is waiting,
# so a burst of README pushes queues one run, not one per push.
concurrency:
  group: translate-readme
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      # The head of the branch, not the pushed commit: a run that waited behind another
      # one must see that run's translation cache and commit.  Full history, so the
      # step below can ask which commit last changed the README.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Latest only.  Translating costs model tokens, so a push is skipped when a newer
      # push has already changed the README (or the translation script): that newer
      # push runs the translation for both.  A manual run always goes ahead.
      - name: Skip a push that a newer README change has replaced
        id: latest
        if: github.event_name == 'push'
        run: |
          git fetch --quiet origin "${{ github.ref_name }}"
          newest=$(git log --first-parent -1 --format=%H "origin/${{ github.ref_name }}" -- README.md scripts/translate-readme)
          if [ "$newest" != "$GITHUB_SHA" ]; then
            echo "Commit $newest changed the README after this push; its run translates it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.latest.outputs.skip != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/translate-readme/package-lock.json

      - name: Install
        if: steps.latest.outputs.skip != 'true'
        working-directory: scripts/translate-readme
        run: npm ci

      # Without this the SDK fails deep in the subprocess with a message that
      # does not name the missing secret.
      - name: Check credentials
        if: steps.latest.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set for this repository."
            echo "Create one with 'claude setup-token' on an account with API access,"
            echo "then add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Translate
        if: steps.latest.outputs.skip != 'true'
        working-directory: scripts/translate-readme
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Through the environment rather than interpolated into the script:
          # the inputs are argument lists, not shell to be expanded.
          LANGUAGES: ${{ inputs.languages || '--tier 1' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: node index.ts $LANGUAGES $FORCE

      - name: Commit translations
        if: steps.latest.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/i18n
          if git diff --cached --quiet; then
            echo "no translation changes"
            exit 0
          fi
          git commit -m "docs: refresh README translations"
          git pull --rebase --quiet origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
